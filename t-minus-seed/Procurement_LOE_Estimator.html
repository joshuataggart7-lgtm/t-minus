<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>[hidden]{display:none!important}</style>
<title>Procurement LOE Estimator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --bg: #F3F5F8; --surface: #FFFFFF; --surface-2: #EAEEF4; --surface-3: #DFE5EE;
    --ink: #172033; --ink-2: #55607A; --ink-3: #8690A6;
    --line: #D5DBE6; --line-strong: #B9C2D2;
    --accent: #1D4F9C; --accent-ink: #FFFFFF; --accent-soft: #E4ECF9; --accent-line: #9DB7E3;
    --co: #1D4F9C; --cs: #6A8FCB;
    --good: #1F7A4D; --good-soft: #DFF1E6; --warn: #9A6B0F; --warn-soft: #FBF0D3; --crit: #B0281F; --crit-soft: #FADFDC;
    --paper: #FFFFFF; --paper-ink: #121212; --paper-muted: #5A5A5A;
    --shadow: 0 1px 2px rgba(23,32,51,.06);
    --focus: #1D4F9C;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --serif: 'Tinos', 'Times New Roman', Times, Georgia, serif;
    --radius: 6px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E131B; --surface: #151C27; --surface-2: #1C2432; --surface-3: #242E3E;
      --ink: #E4E9F1; --ink-2: #A6B0C2; --ink-3: #737E93;
      --line: #2A3444; --line-strong: #3B475B;
      --accent: #86ADEE; --accent-ink: #0E131B; --accent-soft: #1B2B46; --accent-line: #35507E;
      --co: #86ADEE; --cs: #4F6E9E;
      --good: #5FC28C; --good-soft: #143222; --warn: #E2B45C; --warn-soft: #3A2D11; --crit: #F1918A; --crit-soft: #401B18;
      --shadow: 0 1px 2px rgba(0,0,0,.3);
      --focus: #86ADEE;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E131B; --surface: #151C27; --surface-2: #1C2432; --surface-3: #242E3E;
    --ink: #E4E9F1; --ink-2: #A6B0C2; --ink-3: #737E93;
    --line: #2A3444; --line-strong: #3B475B;
    --accent: #86ADEE; --accent-ink: #0E131B; --accent-soft: #1B2B46; --accent-line: #35507E;
    --co: #86ADEE; --cs: #4F6E9E;
    --good: #5FC28C; --good-soft: #143222; --warn: #E2B45C; --warn-soft: #3A2D11; --crit: #F1918A; --crit-soft: #401B18;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    --focus: #86ADEE;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; min-height: 100vh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  p { margin: 0; }
  a { color: var(--accent); }

  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; flex-direction: column; gap: 1px; min-width: 220px; }
  .eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
  .brand h1 { font-size: 18px; font-weight: 600; letter-spacing: -.01em; }
  .audience { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 999px; padding: 3px; background: var(--surface-2); }
  .audience label { padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
  .audience input { position: absolute; opacity: 0; width: 0; height: 0; }
  .audience label.on { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }
  .topbar .spacer { flex: 1; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 13px; cursor: pointer; line-height: 1.2; white-space: nowrap; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn.quiet:hover { background: var(--surface-2); color: var(--ink); }
  .btn.small { padding: 4px 9px; font-size: 12px; }
  details.menu { position: relative; }
  details.menu > summary { list-style: none; }
  details.menu > summary::-webkit-details-marker { display: none; }
  .menu-list { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 230px; padding: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.14); display: flex; flex-direction: column; }
  .menu-list button { text-align: left; padding: 8px 10px; border: 0; background: transparent; border-radius: 4px; cursor: pointer; font-size: 13px; color: var(--ink); }
  .menu-list button:hover { background: var(--surface-2); }
  .menu-list hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

  .app { display: grid; grid-template-columns: 430px minmax(0, 1fr); gap: 0; min-height: calc(100vh - 60px); }
  .inputs { position: sticky; top: 61px; align-self: start; max-height: calc(100vh - 61px); overflow-y: auto; padding: 18px 18px 60px; border-right: 1px solid var(--line); background: var(--surface); }
  .results { padding: 20px 26px 80px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }

  .group { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; background: var(--surface); }
  .group > summary { cursor: pointer; padding: 10px 14px; font-size: 13px; font-weight: 600; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary .pill { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-weight: 400; }
  .group > summary::after { content: ''; width: 6px; height: 6px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(45deg); transition: transform .15s; margin-left: auto; }
  .group[open] > summary::after { transform: rotate(-135deg); }
  .group-body { padding: 4px 14px 14px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label { font-size: 12px; font-weight: 500; color: var(--ink-2); }
  .field .hint { font-size: 11.5px; color: var(--ink-3); line-height: 1.4; }
  .row { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  .row.three { grid-template-columns: 1fr 1fr 1fr; }
  input[type="text"], input[type="date"], input[type="number"], select, textarea { width: 100%; padding: 7px 9px; border-radius: var(--radius); border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 13px; line-height: 1.4; }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); outline: 2px solid var(--accent-soft); outline-offset: 0; }
  input.money, input.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  textarea { min-height: 60px; resize: vertical; }
  .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .check { display: flex; align-items: flex-start; gap: 7px; font-size: 12.5px; cursor: pointer; line-height: 1.35; }
  .check input { margin: 2px 0 0; accent-color: var(--accent); flex: none; }
  .inline-note { padding: 8px 11px; border-radius: 6px; font-size: 12px; line-height: 1.45; background: var(--accent-soft); color: var(--ink); border-left: 3px solid var(--accent); }
  .inline-note.warn { background: var(--warn-soft); border-left-color: var(--warn); }
  .inline-note.good { background: var(--good-soft); border-left-color: var(--good); }
  .rate-line { font-family: var(--mono); font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 6px; padding: 8px 10px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .rate-line b { color: var(--ink); font-weight: 500; }

  /* results */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
  .tile .k { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
  .tile .v { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--ink); margin-top: 4px; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .tile .v.accent { color: var(--accent); }
  .tile .s { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .card-head h2 { font-size: 14px; font-weight: 600; }
  .card-head .sub { font-size: 12px; color: var(--ink-3); }
  .card-body { padding: 14px 16px; }
  .card-body.flush { padding: 0; }
  .tbl-wrap { overflow-x: auto; }
  table.wbs { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.wbs th { text-align: left; padding: 8px 10px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.wbs td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  table.wbs td.n, table.wbs th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.wbs tr.phase td { background: var(--surface-2); font-weight: 600; padding: 8px 10px; }
  table.wbs tr.phase td.n { color: var(--accent); }
  table.wbs td.wbsno { font-family: var(--mono); font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  table.wbs td.basis { font-size: 11.5px; color: var(--ink-3); max-width: 240px; }
  table.wbs tr.total td { font-weight: 700; background: var(--accent-soft); }
  table.wbs input.hrs { width: 72px; padding: 4px 6px; font-family: var(--mono); text-align: right; font-size: 12.5px; }
  table.wbs input.hrs.edited { border-color: var(--warn); background: var(--warn-soft); }
  table.wbs .ghost { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); display: block; text-align: right; }
  table.wbs .split { height: 6px; border-radius: 3px; background: var(--cs); overflow: hidden; min-width: 60px; }
  table.wbs .split i { display: block; height: 100%; background: var(--co); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); align-items: center; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .bars { display: flex; flex-direction: column; gap: 8px; }
  .bar-row { display: grid; grid-template-columns: 170px 1fr 120px; gap: 10px; align-items: center; font-size: 12.5px; }
  .bar-row .track { height: 12px; background: var(--surface-3); border-radius: 6px; overflow: hidden; display: flex; }
  .bar-row .co { height: 100%; background: var(--co); }
  .bar-row .cs { height: 100%; background: var(--cs); }
  .bar-row .val { font-family: var(--mono); font-size: 12px; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .timeline { display: flex; height: 30px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  .timeline div { display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; color: #fff; min-width: 0; overflow: hidden; white-space: nowrap; }
  .tl-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
  .tl-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .triggers { display: flex; flex-direction: column; gap: 6px; }
  .trigger { display: grid; grid-template-columns: 8px auto 1fr; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 6px; background: var(--surface-2); font-size: 12.5px; line-height: 1.45; }
  .trigger .bar { width: 8px; min-height: 18px; height: 100%; border-radius: 4px; background: var(--accent); }
  .trigger.warn .bar { background: var(--warn); }
  .trigger.high .bar { background: var(--crit); }
  .trigger .tag { font-family: var(--mono); font-size: 11px; color: var(--ink-3); padding-top: 2px; white-space: nowrap; }
  .msg { font-family: var(--serif); font-size: 15px; line-height: 1.55; color: var(--ink); }
  .fy { width: 100%; border-collapse: collapse; font-size: 13px; }
  .fy th { text-align: left; padding: 8px 10px; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; border-bottom: 1px solid var(--line); }
  .fy td { padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .fy td.n, .fy th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .fy tr.total td { font-weight: 700; background: var(--accent-soft); }
  .about p { max-width: 72ch; line-height: 1.55; }
  .about p + p { margin-top: 8px; }
  .about ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.5; }
  .about h3 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin: 14px 0 6px; }
  dialog { border: 1px solid var(--line); border-radius: 10px; padding: 0; background: var(--surface); color: var(--ink); max-width: min(760px, calc(100vw - 32px)); width: 100%; box-shadow: 0 24px 64px rgba(0,0,0,.3); }
  dialog::backdrop { background: rgba(10,14,20,.5); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .dlg-head h2 { font-size: 16px; font-weight: 600; }
  .dlg-body { padding: 18px 20px 22px; max-height: 70vh; overflow: auto; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 50; max-width: min(520px, calc(100vw - 32px)); }
  .paper { display: none; }

  @media (max-width: 1000px) {
    .app { grid-template-columns: 1fr; }
    .inputs { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
    .results { padding: 16px 14px 60px; }
    .bar-row { grid-template-columns: 120px 1fr 90px; }
  }
  @media (prefers-reduced-motion: reduce) { .group > summary::after { transition: none; } }
  @media print {
    @page { margin: .75in; }
    body { background: #fff; color: #000; }
    .topbar, .inputs, dialog, .toast, .no-print { display: none !important; }
    .app { display: block; }
    .results { padding: 0; }
    .card, .tile { box-shadow: none; break-inside: avoid; }
    table.wbs input.hrs { border: 0; background: transparent; padding: 0; }
    table.wbs .ghost { display: none; }
  }
</style>
</head>
<body>


<header class="topbar">
  <div class="brand">
    <div class="eyebrow">NASA Ames · Office of Procurement · cradle-to-grave workload model</div>
    <h1>Procurement LOE Estimator</h1>
  </div>
  <div class="audience" id="audience" role="radiogroup" aria-label="Who the estimate is for">
    <label class="on"><input type="radio" name="audience" value="agency" checked>Reimbursable customer</label>
    <label><input type="radio" name="audience" value="nasa">NASA requestor (WBS)</label>
  </div>
  <span class="spacer"></span>
  <div class="topbar-actions">
    <button class="btn" id="btnReset" type="button">Reset hours to model</button>
    <button class="btn primary" id="btnDocx" type="button">Export memo (Word)</button>
    <button class="btn" id="btnPrint" type="button">Print / PDF</button>
    <details class="menu" id="moreMenu">
      <summary class="btn" role="button" aria-haspopup="true">More</summary>
      <div class="menu-list">
        <button type="button" id="btnCsv">Export WBS (.csv)</button>
        <button type="button" id="btnSave">Save estimate (.json)</button>
        <button type="button" id="btnLoad">Load estimate (.json)</button>
        <hr>
        <button type="button" id="btnAbout">Method and sources</button>
        <button type="button" id="btnClear">Start over</button>
      </div>
    </details>
  </div>
</header>

<main class="app">
  <aside class="inputs" id="inputs"></aside>
  <section class="results" id="results"></section>
</main>

<dialog id="aboutDialog" aria-labelledby="aboutTitle">
  <div class="dlg-head"><h2 id="aboutTitle">Method and sources</h2><button class="btn quiet" type="button" data-close>Close</button></div>
  <div class="dlg-body about" id="aboutBody"></div>
</dialog>
<input type="file" id="fileLoad" accept="application/json,.json" hidden>

<script>
/* =========================================================
   Procurement LOE Estimator — cradle-to-grave CO/CS workload
   and cost model. Single file, no external code.
   Successor to the April 2026 "NASA CO Level of Effort
   Estimator" (hours only); adds the CO/CS split, 2026 GS
   rates with burden, an editable WBS, by-year spread, and
   memo, CSV, and JSON exports.
   ========================================================= */
const BUILD_STAMP = '2026-09-09';
const STORAGE_KEY = 'procurement-loe-estimator-v2';

/* ---------- thresholds (RFO FAR, Oct 1, 2025 inflation adjustment) ---------- */
const TH = { MPT: 15000, SAT: 350000, COMM_SIMP: 9000000, COMM_SIMP_HI: 15000000, CCPD: 2500000, SUBK: 900000, JOFOC_T2: 900000, JOFOC_T3: 20000000, JOFOC_T4: 150000000, PUBLIC_ANNOUNCE: 5500000, HQ_ANNOUNCE: 7000000, ANOSCA: 30000000 };

/* ---------- 2026 GS hourly basic rates (OPM Salary Tables 2026, steps 1/5/10) ---------- */
const GS_CAP_HOURLY = 94.49; // Executive Schedule Level IV cap as shown on the 2026 tables
const LOCALITIES = {
  SF:  { name: 'San Jose–San Francisco–Oakland (Ames)', pct: 46.34, rates: { 9: [36.97, 41.90, 48.07], 11: [44.73, 50.70, 58.16], 12: [53.62, 60.77, 69.70], 13: [63.76, 72.26, 82.88], 14: [75.34, 85.39, 94.49], 15: [88.62, 94.49, 94.49] } },
  RUS: { name: 'Rest of U.S. (Stennis and others)', pct: 17.06, rates: { 9: [29.57, 33.52, 38.45], 11: [35.78, 40.55, 46.52], 12: [42.89, 48.61, 55.76], 13: [51.00, 57.80, 66.30], 14: [60.27, 68.30, 78.35], 15: [70.89, 80.34, 92.16] } },
  DCB: { name: 'Washington–Baltimore (HQ)', pct: 33.94, rates: { 9: [33.84, 38.35, 43.99], 11: [40.94, 46.40, 53.23], 12: [49.07, 55.62, 63.80], 13: [58.35, 66.14, 75.86], 14: [68.96, 78.15, 89.65], 15: [81.11, 91.93, 94.49] } },
  HOU: { name: 'Houston (JSC)', pct: 35.00, rates: { 9: [34.11, 38.66, 44.34], 11: [41.27, 46.77, 53.65], 12: [49.46, 56.06, 64.30], 13: [58.82, 66.66, 76.46], 14: [69.50, 78.77, 90.36], 15: [81.75, 92.65, 94.49] } },
};
function gsHourly(locality, grade, step) {
  const t = LOCALITIES[locality] || LOCALITIES.SF;
  const r = t.rates[grade] || t.rates[13];
  const s = Math.max(1, Math.min(10, Number(step) || 1));
  let rate;
  if (s === 1) rate = r[0]; else if (s === 5) rate = r[1]; else if (s === 10) rate = r[2];
  else { const inc = (r[1] - r[0]) / 4; rate = r[0] + inc * (s - 1); }
  return Math.min(Math.round(rate * 100) / 100, GS_CAP_HOURLY);
}

/* ---------- utilities ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n, dec = 0) => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const num = (n, dec = 0) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const parseMoney = (s) => { const d = String(s ?? '').replace(/[^0-9.]/g, ''); return d === '' ? '' : String(Math.round(Number(d))); };
const shortMoney = (n) => n >= 1e9 ? '$' + (n / 1e9).toFixed(1) + 'B' : n >= 1e6 ? '$' + (n / 1e6).toFixed(n >= 10e6 ? 0 : 1) + 'M' : n >= 1e3 ? '$' + Math.round(n / 1e3) + 'K' : '$' + n;

  const admin = phases[3], close = phases[4];

  const monthsToAward = m.timeline.preMonths + m.timeline.solMonths + m.timeline.evalMonths + m.timeline.awardMonths;
  return { model: m, rates: r, rows, phases, total, preAward, preAwardCost, lo, hi, byYear, monthsToAward, ctx: m.ctx };

function showAbout() {
  $('#aboutBody').innerHTML = `
    <p>The estimator maps regulatory requirements to the discrete tasks a contracting officer and contract specialist perform from purchase request intake through contract closeout, sizes each task from the acquisition profile and complexity drivers selected, splits the hours between the two roles, and prices them at General Schedule rates with burden. Every hour in the work breakdown structure can be overridden; the model value stays visible beneath an edited figure.</p>
    <h3>Verified against current text (checked ${BUILD_STAMP})</h3>
    <ul>
      <li>Thresholds: simplified acquisition threshold $350,000 (RFO FAR 2.101); commercial simplified procedures $9M / $15M (FAR 12.102, Table 12-1); JOFOC approval tiers $900K / $20M / $150M (FAR 6.104-2); public announcement $5.5M (FAR 5.302); justification posting 14 days, 30 days for urgency (FAR 6.301).</li>
      <li>Section numbers in RFO Parts 5, 6, 12, and 15 (5.101, 5.201, 5.302, 6.103, 6.104, 6.301, 12.102, 12.201-1, 15.102, 15.103, 15.106, 15.202, 15.206, 15.207, 15.301, 15.403, 15.404, 15.407, 15.408).</li>
      <li>Rates: OPM 2026 General Schedule hourly basic rates for the San Jose–San Francisco–Oakland, Rest of U.S., Washington–Baltimore, and Houston localities (1.0 percent general increase, locality percentages unchanged from 2025; steps other than 1, 5, and 10 are interpolated and capped at Executive Schedule Level IV). Fringe 36.25 percent from OMB M-08-13 (Circular A-76). Full-cost pricing of reimbursable work from NPR 9090.1C (Appendix C EPR/ECR).</li>
    </ul>
    <h3>Carried from the April 2026 build (Companion Guide and internal references not publicly verifiable)</h3>
    <ul>
      <li>NFS CG 1807.71, 1807.11, 1807.12, 1807.13(d), 1807.51, 1804.111, 1801.6, 1812, 1815.1, 1815.2, 1815.45(b), 1815.48, 1815.49, 1816.62, 1816.66, 1817.24, 1819, 1825.12, 1834; PCD 25-09, 25-16, 25-21, 25-23; PIC 26-01; PN 24-09; subcontracting plan threshold $900,000; certified cost or pricing data threshold $2.5M; HQ announcement $7M and ANOSCA $30M.</li>
      <li>FAR Parts whose RFO section numbering was not checked are cited by Part only (Parts 4, 7, 9, 10, 16, 17, 19, 27, 32, 39, 42, 43, 45).</li>
    </ul>
    <h3>What changed from the April 2026 estimator</h3>
    <ul>
      <li>Hours are split between the contracting officer and the contract specialist and priced, with a range; the April build reported hours only.</li>
      <li>Instrument and pricing arrangement are separate inputs; orders under an existing IDIQ scale the pre-award phases and swap the JOFOC for an exception to fair opportunity; simplified acquisitions scale to 40 percent.</li>

      <li>Added a by-year spread for annual funding or WBS planning, editable hours, a memorandum export in NF 1858 layout, and CSV and JSON exports.</li>
    </ul>`;
  $('#aboutDialog').showModal();

  $('#btnReset').addEventListener('click', () => { S.overrides = {}; update(); toast('Hours reset to the model.'); });

  $('#fileLoad').addEventListener('change', (ev) => {
    const file = ev.target.files && ev.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { try { const p = JSON.parse(reader.result); if (!p || typeof p !== 'object' || !('V' in p)) throw new Error('bad'); S = Object.assign(defaults(), p); S.flags = Object.assign(defaults().flags, p.flags || {}); S.overrides = p.overrides || {}; syncInputs(); update(); toast('Estimate loaded.'); } catch (e) { toast('That file is not an LOE estimate.'); } };
    reader.readAsText(file); ev.target.value = '';

  $('#btnAbout').addEventListener('click', () => { $('#moreMenu').open = false; showAbout(); });
  $('#btnClear').addEventListener('click', () => { $('#moreMenu').open = false; S = defaults(); syncInputs(); update(); toast('Reset to the sample estimate.'); });
  $$('dialog [data-close]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));
  $$('dialog').forEach(d => d.addEventListener('click', (ev) => { if (ev.target === d) d.close(); }));
  document.addEventListener('click', (ev) => { const m = $('#moreMenu'); if (m.open && !m.contains(ev.target)) m.open = false; });
}
